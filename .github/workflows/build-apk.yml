name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Build APK with Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --yes -v

      - name: Find and List Generated APKs
        run: |
          echo "Listing all generated APK files:"
          find build -type f -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.2' }}
          name: "LimitApp AI Pro v1.4.2 (Updated Gemini Models & Responsive UI Fixes)"
          body: |
            ## 📱 LimitApp AI Pro v1.4.2 для Android

            Обновление с актуализацией моделей Google Gemini API и исправлением адаптивности кнопок интерфейса:

            ### 🚀 Что нового в v1.4.2:
            - **✨ Актуальные модели Google Gemini API**:
              - Модели обновлены на актуальную линейку: `gemini-3.1-flash-lite` (быстрый, стабильный и бесплатный по умолчанию), `gemini-3.5-flash-lite` (высокопроизводительный) и `gemini-3.8-flash` (флагманский).
              - **Автоматический Fallback**: если выбранная модель перегружена (503) или недоступна (404), приложение автоматически и бесшовно переключается на стабильную `gemini-3.1-flash-lite` без показа ошибки пользователю.
            - **🎨 Исправление интерфейса (переполнение кнопок)**:
              - Все строки кнопок карточек ошибок и результатов переведены на адаптивный перенос (`wrap=True`). Кнопки больше не вылезают за границы экрана и не обрезаются на смартфонах любой ширины.
            - **⚡ Двойной движок вычислений**:
              - Мгновенное аналитическое решение SymPy со 100% офлайн работой.
              - Преподавательский разбор и объяснение теорем через искусственный интеллект Google Gemini.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
