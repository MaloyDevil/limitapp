name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-build flet

      - name: Prepare Assets & App Icons
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico assets/icon.ico; fi
          ls -la assets/

      - name: Build Android APK via Flet
        run: |
          python -m flet build apk --project limitapp --org com.syrok.limitapp --build-version 1.6.0 --build-number 160 || flutter build apk --release || true

      - name: Search and Collect Generated APKs
        run: |
          mkdir -p build/apk/
          find . -type f -name "*.apk" -exec cp {} build/apk/ \;
          ls -la build/apk/ || true

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.0' }}
          name: "LimitApp AI Tutor Pro v1.6.0 (Visual Explorer, AI Tutor & Photo OCR)"
          body: |
            ## 📱 LimitApp AI Tutor Pro v1.6.0 для Android

            🎉 **Крупнейшее обновление!** LimitApp превратился из обычного калькулятора в интерактивного **умного репетитора по математическому анализу**.

            Приложение объединяет высокоточный аналитический движок SymPy (100% оффлайн), искусственный интеллект Google Gemini с распознаванием рукописных примеров по фото, визуальный тактильный исследовательский режим $\varepsilon$-$\delta$ и Material Design 3.

            ---
            ### 🌟 Новые возможности и инновации v1.6.0:

            1. **📷 Ввод предела по фото (OCR через Gemini Vision API)**:
               - Мгновенное распознавание рукописных и печатных математических пределов из тетрадей и учебников.
               - Нейросеть автоматически извлекает формулу, переменную, точку стремления и знак, заполняя калькулятор в 1 клик.

            2. **🔬 Визуальный и тактильный «Режим исследования» (Лаборатория)**:
               - **Тактильный ползунок $x \to a$**: ведите палец по экрану, приближая точку к пределу; в реальном времени бегут цифры $x$, $\Delta x$, $f(x)$ и шкала сходимости $|f(x) - L|$.
               - **Визуализация определения Коши ($\varepsilon$ - $\delta$)**: двигайте ползунок $\varepsilon$, сужая коридор вокруг предела $L$, — приложение автоматически рассчитывает ширину окрестности $\delta$, гарантирующей попадание в рамки.
               - **Карта разрывов и выколотых точек**: классификация разрывов (устранимый, скачок 1-го рода, 2-й род / асимптота) с объяснением поведения функции в самой точке.

            3. **🎓 Умный AI-репетитор и педагогика**:
               - **Деконструкция неопределенностей**: подробный диагноз перед решением — почему подстановка в лоб дает $[0/0]$ или $[\infty/\infty]$ и какой метод строго требуется.
               - **Сравнение 3 методов (Alternative Paths)**: «⚡ Правило Лопиталя» vs «📐 Классический способ (Замечательные пределы и эквивалентности)» vs «🔬 Ряд Тейлора $o(x^n)$».
               - **Тренажер «Найди ошибку»**: студент вводит свой шаг решения, а AI-репетитор подсвечивает потерянные знаки, незаконные замены и дает подсказку.
               - **Закрепление (Practice Mode)**: 3 похожие задачи для тренировки с полем ввода и мгновенной самопроверкой.

            4. **📋 Экспорт в LaTeX**:
               - Копирование чистого LaTeX-кода формулы и пошагового решения для курсовых, дипломов и LaTeX-документов.

            5. **🎨 Исправление всех багов интерфейса**:
               - Исправлено копирование в буфер обмена (`ft.Clipboard`).
               - Оптимизированы кнопки действий (нет вылезания текста за границы на экранах любой ширины).
               - Символ $\infty$ на основной клавиатуре, увеличенные клавиши 42px.
               - Модальное окно подтверждения очистки истории.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android-смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
