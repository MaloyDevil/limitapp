name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Build APK with Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --yes -v

      - name: Find and List Generated APKs
        run: |
          echo "Listing all generated APK files:"
          find build -type f -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: "LimitApp Pro v1.3.0 (Release APK)"
          body: |
            ## 📱 LimitApp Pro v1.3.0 для Android
            
            Обновленная версия мобильного аналитического калькулятора математических пределов для Android.
            
            ### ✨ Что нового в v1.3.0:
            - **Исправлен интерфейс кнопок**: устранены выходы элементов за границы кнопок (`tight=True`, защита от обрезки и переполнения).
            - **Универсальный ввод пределов**:
              - Полноценная поддержка LaTeX-синтаксиса (`\frac{...}{...}`, `\sqrt{...}`, `\cdot`, `\infty`, `\pi`).
              - Умное распознавание тригонометрических степеней (`sin^2(x)`, `cos^3(x)`), скобок `[...]` и `{...}`, факториалов `n!`, модулей `|x|` и десятичных запятых `0,5`.
              - Автоматическое извлечение полных строк пределов (`lim (x->0) ...`, `lim_{n->oo} ...`, `\lim_{x \to 0} ...`).
              - Быстрый выбор переменных (`x`, `n`, `t`, `y`), значений $x_0$ и динамический предпросмотр формулы в реальном времени.
            - **🎨 Новая адаптивная иконка (Android Adaptive Icon)**:
              - Иконка чётко и ровно вырезана без двойных границ, черных или белых полей.
              - Эмблема центрирована в 60% безопасной зоне (safe zone) и адаптируется под любой Android лаунчер (круглый, скругленный квадрат, squircle).
              - Добавлена настройка фона адаптивной иконки `--android-adaptive-icon-background "#0d1838"`.
            
            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
