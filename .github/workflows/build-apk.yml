name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Prepare Assets & App Icons
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico assets/icon.ico; fi
          ls -la assets/

      - name: Build Android APK via Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.1 --build-number 161 --yes -v || python -m flet.cli build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.1 --build-number 161 --yes -v

      - name: Search and Collect Generated APKs
        run: |
          mkdir -p build/apk/
          find . -type f -name "*.apk" -exec cp {} build/apk/ \;
          ls -la build/apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.1' }}
          name: "LimitApp AI Tutor Pro v1.6.1 (Clean UI Overhaul & Ergonomics)"
          body: |
            ## 📱 LimitApp AI Tutor Pro v1.6.1 для Android

            🎉 **Полное визуальное преображение и редизайн интерфейса!**

            Мы полностью переработали весь интерфейс LimitApp: устранили визуальный шум, избавились от громоздких рамок и проволочных сеток, сделали приложение быстрым, чистым, эргономичным и визуально приятным на экранах любых смартфонов.

            ---
            ### ✨ Главные изменения в обновлении v1.6.1:

            1. **🎨 Тотальный редизайн интерфейса (Clean Dark Studio)**:
               - Премиальная обсидиановая тёмная тема (`#090D16`), плавные поверхности карточек (`#121826`) и мягкие внутренние контейнеры (`#182234`).
               - Полностью удалены тяжёлые контрастные серые рамки и обводки вокруг каждого элемента.
               - Аккуратные скругления углов (12-16px) и выверенная типографика без нагромождения.

            2. **⌨️ Умная складная математическая клавиатура**:
               - Кнопка быстрого скрытия/показа клавиатуры (`⌨️ Клавиши` / `⌨️ Скрыть`) прямо в панели управления.
               - При нажатии «Рассчитать» клавиатура автоматически плавно сворачивается, мгновенно выводя карточку с ответом и шагами на экран без необходимости прокручивать вниз!
               - Клавиши оформлены в мягком плоском стиле без рамок: цифры, операторы, тригонометрия и удаление с приятным тактильным откликом.

            3. **🎯 Эргономичный ввод параметров предела**:
               - Компактные и плотные поля ввода функции `f(x)`, переменной и точки `x₀`.
               - Быстрые чипы значений (`0`, `+∞`, `-∞`, `1`, `-1`, `π`, `e`) в одной аккуратной строке под точкой.
               - Очищенная верхняя панель (AppBar): убраны лишние иконки, оставлены только быстрый ввод по фото (OCR) и настройки AI.

            4. **🏆 Герой-карточка ответа и пошаговые карточки**:
               - Крупный, чёткий и выразительный ответ (`L = ...`) со статусом сходимости и бейджем аналитического ядра SymPy CAS.
               - Быстрый тулбар: копирование чистого текста, экспорт в LaTeX, мгновенный перенос предела в интерактивную Лабораторию и Избранное.
               - Пошаговое решение с цветными номерами шагов (1, 2, 3), альтернативные пути решения и таблица приближения.

            5. **🔬 Обновление всех остальных вкладок**:
               - Лаборатория, Репетитор, Справочник и История приведены к единому дизайн-коду.
               - Полная защита от белого экрана при системной светлой теме Android.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android-смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
