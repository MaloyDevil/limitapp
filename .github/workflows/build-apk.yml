name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Prepare Assets & App Icons
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico assets/icon.ico; fi
          ls -la assets/

      - name: Build Android APK via Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.2 --build-number 162 --yes -v || python -m flet.cli build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.2 --build-number 162 --yes -v

      - name: Search and Collect Generated APKs
        run: |
          mkdir -p build/apk/
          find . -type f -name "*.apk" -exec cp {} build/apk/ \;
          ls -la build/apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.2' }}
          name: "LimitApp AI Tutor Pro v1.6.2 (Handbook & History Grey Box Fix, Text Overflow Resolution)"
          body: |
            ## 📱 LimitApp AI Tutor Pro v1.6.2 для Android

            🎉 **Полное исправление отображения справочника, истории и устранение переполнения текста!**

            В этом обновлении устранены серые и белые блоки в разделах Справочника и Истории, а также предотвращено любое обрезание и переполнение текста на экранах мобильных устройств.

            ---
            ### ✨ Главные изменения в обновлении v1.6.2:

            1. **📚 Полное исправление вкладок «Справочник» и «История»**:
               - Устранены артефакты Flutter M3, вызывавшие появление сплошного серого прямоугольника вместо формул и карточек.
               - Заменены нестабильные `ExpansionTile` на нативные карточки категорий с красивыми заголовками, чипами и прямым отображением примеров.
               - Все фоны строго переведены на фирменную обсидиановую палитру (`#090D16`, `#121826`, `#182234`) с контрастным белым и лазурным текстом.

            2. **📱 Защита от переполнения и обрезания текста на мобильных экранах**:
               - Лаконичные и аккуратные названия вкладок нижней панели навигации (`Кальк`, `График`, `Репетитор`, `Теория`, `История`), которые гарантированно помещаются на любых смартфонах даже с крупным системным шрифтом.
               - Добавлен автоматический перенос строк (`wrap=True`) и эллипсис (`overflow=ELLIPSIS`) для длинных математических формул, заголовков и карточек истории.

            3. **⚡ Стабильность и оптимизация**:
               - Проверена работа всех аналитических модулей SymPy CAS, интерактивного графопостроителя и пошагового решателя.
               - Полная совместимость со светлой и тёмной системными темами Android без сбоя палитры.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android-смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
