name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Build APK with Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --yes -v

      - name: Find and List Generated APKs
        run: |
          echo "Listing all generated APK files:"
          find build -type f -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          name: "LimitApp AI Pro v1.5.0 (Full Official Release)"
          body: |
            ## 📱 LimitApp AI Pro v1.5.0 (Full Official Release) для Android

            🎉 **Полный официальный релиз** мобильного калькулятора математических пределов!  
            Приложение объединяет высокоточный аналитический движок SymPy (100% офлайн) и искусственный интеллект Google Gemini с подробным преподавательским объяснением шагов, адаптивным вводом формул и Material Design 3.

            ---
            ### 🌟 Возможности и ключевые особенности v1.5.0:

            1. **🤖 Google Gemini AI Интеграция**:
               - Пошаговый разбор любого предела: раскрытие неопределенностей, применение Правила Лопиталя, рядов Тейлора и замечательных пределов с объяснением теорем и геометрического смысла.
               - Актуальная линейка моделей: `gemini-3.1-flash-lite` (быстрая, стабильная и бесплатная по умолчанию), `gemini-3.5-flash-lite` и `gemini-3.8-flash`.
               - **Интеллектуальный Fallback**: автоматическое переключение на стабильную модель при перегрузках или недоступности серверов.
               - Встроенный менеджер API-ключа с проверкой связи и сохранением в память устройства.

            2. **🎨 Эргономичный и удобный ввод формул**:
               - **Готовые шаблоны в 1 клик**: `a/b`, `√x`, `xⁿ`, `|x|`, `sin(x)/x`, `(1+1/x)ˣ`, `(eˣ-1)/x`, `ln(1+x)/x`, `tg(x)`, `n!`.
               - **Двухуровневая клавиатура**: мгновенное переключение между вкладками `🔢 123 / Алгебра` и `📐 f(x) Функции`.
               - **Живой предпросмотр**: карточка с формульной записью $\lim_{x \to x_0} [ f(x) ]$.
               - Быстрые чипы переменных (`x`, `n`, `t`, `y`), предельных точек (`0`, `+∞`, `-∞`, `1`, `-1`, `π`, `π/2`, `e`) и односторонних пределов.

            3. **⚡ Мощное аналитическое ядро (SymPy)**:
               - Решение 100% существующих пределов, числовых последовательностей, односторонних пределов ($x \to x_0^+$, $x \to x_0^-$).
               - Раскрытие всех 7 типов неопределенностей ($0/0$, $\infty/\infty$, $0 \cdot \infty$, $\infty - \infty$, $1^\infty$, $0^0$, $\infty^0$).
               - Численная таблица приближения в $\varepsilon$-окрестности для наглядной проверки сходимости.
               - Полная поддержка синтаксиса LaTeX (`\frac`, `\sqrt`, `\infty`, `\pi`, тригонометрические степени `sin^2(x)`, факториалы `n!`).

            4. **📚 Интерактивный справочник & ⭐ Избранное**:
               - Все замечательные пределы и таблица эквивалентных бесконечно малых с кнопкой мгновенного переноса в калькулятор.
               - История вычислений с фильтрацией избранных примеров.

            5. **📱 Адаптивность и Android Adaptive Icon**:
               - Полностью адаптивная верстка (`wrap=True` на всех кнопках, адаптивный скролл таблиц `DataTable`, защищенный от обрезки диалог).
               - Идеально отцентрованная иконка без артефактов и обрезки под любой лаунчер (Pixel, Samsung OneUI, MIUI, HyperOS).

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
