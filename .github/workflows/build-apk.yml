name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Build APK with Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --yes -v

      - name: Find and List Generated APKs
        run: |
          echo "Listing all generated APK files:"
          find build -type f -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: "LimitApp AI Pro v1.4.0 (Google Gemini AI & Smart Formula Input)"
          body: |
            ## 📱 LimitApp AI Pro v1.4.0 для Android

            Масштабное обновление мобильного калькулятора математических пределов: интеграция с бесплатным искусственным интеллектом Google Gemini, кардинально обновленный ввод формул с интерактивными шаблонами и двухуровневой клавиатурой!

            ### 🚀 Главные нововведения в v1.4.0:
            1. **✨ Интеграция с Google Gemini AI**:
               - Решение математических пределов любой сложности с подробным преподавательским анализом, обоснованием теорем и геометрическим смыслом.
               - Поддержка моделей `Gemini 1.5 Flash` (быстрая и бесплатная), `Gemini 2.0 Flash` (новейший ИИ) и `Gemini 1.5 Pro` (глубокий анализ).
               - Встроенное окно настроек API-ключа с проверкой статуса подключения и ссылкой на получение бесплатного ключа в Google AI Studio.
               - Кнопка сверки аналитического решения SymPy с объяснением нейросети.
            2. **🎨 Кардинально обновленный и удобный ввод примера**:
               - **Интерактивные шаблоны задач в 1 клик**: `a/b`, `√x`, `xⁿ`, `|x|`, `sin(x)/x`, `(1+1/x)ˣ`, `(eˣ-1)/x`, `ln(1+x)/x`, `tg(x)`, `n!`.
               - **Двухуровневая математическая клавиатура**: удобное переключение между `🔢 123 / Алгебра` и `📐 f(x) Функции`. Крупные удобные кнопки, быстрый ввод степеней $x^2, x^3, e^x$ и дробей $1/x$.
               - **Живой математический предпросмотр**: карточка с красивой нотацией $\lim_{x \to x_0} [ f(x) ]$.
               - Быстрые чипы переменных (`x`, `n`, `t`, `y`), точек стремления (`0`, `+∞`, `-∞`, `1`, `-1`, `π`, `π/2`, `e`) и знаков односторонних пределов.
            3. **⚡ Расширенный аналитический движок**:
               - Раскрытие всех 7 типов неопределенностей ($0/0$, $\infty/\infty$, $0 \cdot \infty$, $\infty - \infty$, $1^\infty$, $0^0$, $\infty^0$).
               - Численная таблица окрестности для наглядной проверки сходимости.
            4. **📱 Android Adaptive Icon**:
               - Четко вырезанная адаптивная иконка без артефактов и обрезки под любой Android лаунчер.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
