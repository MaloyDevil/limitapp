name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Prepare Assets & App Icons
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico assets/icon.ico; fi
          ls -la assets/

      - name: Build Android APK via Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.3 --build-number 163 --yes -v || python -m flet.cli build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.6.3 --build-number 163 --yes -v

      - name: Search and Collect Generated APKs
        run: |
          mkdir -p build/apk/
          find . -type f -name "*.apk" -exec cp {} build/apk/ \;
          ls -la build/apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.6.3' }}
          name: "LimitApp AI Tutor Pro v1.6.3 (Fix Handbook INDETERMINACIES Crash & Complete UI Polish)"
          body: |
            ## 📱 LimitApp AI Tutor Pro v1.6.3 для Android

            🎉 **Срочный хотфикс: устранение ошибки запуска вкладки Справочника (`module 'presets' has no attribute 'INDETERMINACIES'`)!**

            В этой версии полностью устранена ошибка атрибута в модуле `presets`, добавлены безопасные геттеры и полностью восстановлена работоспособность вкладки теории и формул.

            ---
            ### ✨ Изменения в релизе v1.6.3:

            1. **🔧 Исправление ошибки `presets.INDETERMINACIES`**:
               - В `presets.py` добавлена таблица `INDETERMINACIES` (алиас к `INDETERMINACY_TABLE`) с детальным описанием всех 7 типов неопределенностей, названиями и формулами примеров.
               - В `main.py` добавлен безопасный доступ `getattr(presets, 'INDETERMINACIES', ...)` и безопасное извлечение полей `.get()`, исключающее падение приложения при любых условиях.

            2. **🎨 Идеальное отображение Справочника и Истории**:
               - Чёткая и контрастная тёмная палитра (`#090D16`, `#121826`, `#182234`) без каких-либо серых или белых блоков.
               - Нативные карточки категорий с бейджами количества формул, таблица эквивалентностей и карточки неопределенностей.

            3. **📱 Полная защита от переполнения текста на смартфонах**:
               - Компактные и надёжные названия вкладок навигации (`Кальк`, `График`, `Репетитор`, `Теория`, `История`).
               - Автоматический перенос строк и эллипсис во всех математических блоках.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android-смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
