name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet flet-cli

      - name: Prepare Assets & App Icons
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then cp icon.png assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico assets/icon.ico; fi
          ls -la assets/

      - name: Build Android APK via Flet
        run: |
          flet build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.7.0 --build-number 170 --yes -v || python -m flet.cli build apk --project limitapp --product "LimitApp" --org com.syrok.limitapp --android-adaptive-icon-background "#0d1838" --build-version 1.7.0 --build-number 170 --yes -v

      - name: Search and Collect Generated APKs
        run: |
          mkdir -p build/apk/
          find . -type f -name "*.apk" -exec cp {} build/apk/ \;
          ls -la build/apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: limitapp-release-apk
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.7.0' }}
          name: "LimitApp Studio AI Pro v1.7.0 (Apple Studio Glass & Floating Frosted Dock Release)"
          body: |
            ## 🍏 LimitApp Studio AI Pro v1.7.0 для Android

            🎉 **Грандиозный редизайн интерфейса в эстетике Apple Studio Glass!**

            Мы полностью переосмыслили и переработали оформление LimitApp, сделав его ультрасовременным, тактильным, эргономичным и визуально вдохновляющим.

            ---
            ### ✨ Главные инновации релиза v1.7.0:

            1. **🫧 Плавающий стеклянный Dock навигации (Floating Frosted Dock)**:
               - Обычная прилипшая к низу панель навигации заменена на парящий матовый стеклянный остров с мягкой тенью и скруглением 26px.
               - Активная вкладка выделяется мягкой светящейся капсулой Apple Royal Blue (`#2563EB`), а остальные вкладки имеют аккуратный минималистичный вид.
               - Вкладки адаптируются под любые размеры экранов и работают плавно без лагов.

            2. **⚡ Карусель мгновенных примеров в 1 клик (Quick Limit Carousel)**:
               - Прямо в начале калькулятора добавлена горизонтальная лента самых популярных пределов (`sin(x)/x`, `(1+1/x)ˣ`, `(eˣ-1)/x`, `ln(1+x)/x`, `(1-cos x)/x²`, `(√x-1)/(x-1)`, `x·ln(x)`).
               - Нажатие на любой пример мгновенно загружает формулу, параметры и сразу вычисляет предел — идеальный способ быстро протестировать приложение!

            3. **💎 Премиальная карточка ответа Apple Studio Hero Result**:
               - Роскошный бокс ответа с акцентной синей рамкой, крупным значением предела `L = ...`, статусом сходимости и бейджем аналитического движка SymPy.
               - Удобный тулбар быстрых действий: копирование чистого текста, экспорт LaTeX, перенос предела в интерактивную Лабораторию и Избранное.

            4. **📱 Умная эргономика ввода**:
               - При нажатии главной кнопки «Рассчитать предел» клавиатура автоматически сворачивается, мгновенно открывая ответ и шаги решения без необходимости скроллить вниз!
               - Тактильные клавиши с четкой цветовой дифференциацией (цифры, операторы, функции, удаление).
               - Новая матовая палитра Slate/Blue (`#0B0F19`, `#111827`, `#162032`), стеклянные разделители и мягкие тени.

            ---
            ### 📥 Установка:
            Скачайте прикрепленный файл `.apk` ниже в разделе **Assets** и установите на Android-смартфон.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
